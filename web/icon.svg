<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="天命系统">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1c2233"/>
      <stop offset="55%" stop-color="#0c0f18"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde7a8"/>
      <stop offset="42%" stop-color="#e4b85a"/>
      <stop offset="100%" stop-color="#9c6a25"/>
    </linearGradient>
    <radialGradient id="taiji" cx="50%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#fde7a8"/>
      <stop offset="100%" stop-color="#c8922f"/>
    </radialGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <!-- 双金外环 -->
  <circle cx="128" cy="128" r="119" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#gold)" stroke-opacity=".55" stroke-width="1.6"/>
  <!-- 八卦分隔细环 + 雷纹点 -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#gold)" stroke-opacity=".35" stroke-width="1.2"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#gold)" stroke-opacity=".5" stroke-width="3" stroke-dasharray="1.5 7"/>

  <!-- 八卦（先天 · 金爻） -->
  <g transform="rotate(0 128 128)">
    <rect x="113" y="26" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="30" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(45 128 128)">
    <rect x="113" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="30" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(90 128 128)">
    <rect x="113" y="26" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="30" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(135 128 128)">
    <rect x="113" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="30" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(180 128 128)">
    <rect x="113" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(225 128 128)">
    <rect x="113" y="26" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(270 128 128)">
    <rect x="113" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="26" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
  <g transform="rotate(315 128 128)">
    <rect x="113" y="26" width="30" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="38" width="13" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="113" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/><rect x="131" y="50" width="13" height="5" rx="2.5" fill="url(#gold)"/>
  </g>

  <!-- 太极（金黑） -->
  <circle cx="128" cy="128" r="46" fill="url(#taiji)"/>
  <path d="M128 82 a46 46 0 0 1 0 92 a23 23 0 0 1 0 -46 a23 23 0 0 0 0 -46 z" fill="#0b0e16"/>
  <circle cx="128" cy="105" r="8" fill="#0b0e16"/>
  <circle cx="128" cy="151" r="8" fill="url(#taiji)"/>
  <circle cx="128" cy="128" r="46" fill="none" stroke="#0b0e16" stroke-opacity=".4" stroke-width="1.5"/>
</svg>
