  button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;font-size:16px;
          font-weight:600;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;cursor:pointer}
  button:active{transform:scale(.98)}
  .err{color:#f87171;font-size:13px;min-height:18px;margin-top:12px}
  .tip{font-size:11px;color:#6b7280;margin-top:16px;line-height:1.5}
</style>

  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  let plain;
  try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data); }
  catch(e){ throw new Error("口令错误"); }
  const html=new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const i=document.getElementById("pw"), e=document.getElementById("err");
function run(){ e.textContent=""; const v=i.value; if(!v){e.textContent="请输入口令";return;}
  unlock(v).catch(err=>{ e.textContent=err.message||"解密失败"; }); }
document.getElementById("go").addEventListener("click",run);
i.addEventListener("keydown",ev=>{ if(ev.key==="Enter") run(); });
i.focus();
</script>
