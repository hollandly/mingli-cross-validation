function b64ToBytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function unlock(pass){
  const buf=b64ToBytes(BLOB);
  const salt=buf.slice(0,16), iv=buf.slice(16,28), tag=buf.slice(28,44), ct=buf.slice(44);
  const data=new Uint8Array(ct.length+tag.length);   // Web Crypto 要求认证标签在密文末尾
  data.set(ct,0); data.set(tag,ct.length);
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  let plain;
  try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data); }
  catch(e){ throw new Error("口令错误"); }
  const html=new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

// ===========================================================================
window.__PUB_BLOB = BLOB;                       // 当前密文（供重加密使用）
window.__PUB_SHELL_HTML = document.documentElement.outerHTML;  // 外壳模板（含⚙与重加密逻辑）

function _pubBytesToB64(u){
  var s=""; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s);
}
function _pubConcat(arrs){
  var len=0; arrs.forEach(function(a){len+=a.length;});
  var o=new Uint8Array(len), off=0;
  arrs.forEach(function(a){o.set(a,off);off+=a.length;}); return o;
}
window.__PUB_reencrypt = async function(cur, neu){
  var buf = b64ToBytes(window.__PUB_BLOB);
  var salt=buf.slice(0,16), iv=buf.slice(16,28), tag=buf.slice(28,44), ct=buf.slice(44);
  var data=new Uint8Array(ct.length+tag.length); data.set(ct,0); data.set(tag,ct.length);
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(cur),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var plain;
  try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,data); }
  catch(e){ throw new Error("当前访问口令错误"); }
  var html=new TextDecoder().decode(plain);
  // 用新口令重新加密
  var salt2=crypto.getRandomValues(new Uint8Array(16));
  var iv2=crypto.getRandomValues(new Uint8Array(12));
  var km3=await crypto.subtle.importKey("raw",enc.encode(neu),"PBKDF2",false,["deriveKey"]);
  var key2=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt2,iterations:600000,hash:"SHA-256"},km3,{name:"AES-GCM",length:256},false,["encrypt"]);
  var ctBuf=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv2},key2,enc.encode(html));
  var ctA=new Uint8Array(ctBuf);
  var ctNew=ctA.slice(0,ctA.length-16), tagNew=ctA.slice(ctA.length-16);
  var blob=_pubConcat([salt2,iv2,tagNew,ctNew]);
  var b64=_pubBytesToB64(blob);
  // 用外壳源重建文件（仅替换 BLOB）
  var FULL=window.__PUB_SHELL_HTML;
  var MARK='const BLOB = "';
  var p=FULL.indexOf(MARK); var s=p+MARK.length; var e=FULL.indexOf('";',s);
  if(p<0||e<0) throw new Error("外壳结构异常，无法重建文件");
  return '<!DOCTYPE html>\n' + FULL.slice(0,s) + b64 + FULL.slice(e);
};

    var m=document.getElementById("pubMsg"); m.style.color="#f87171"; m.textContent="";
    var cur=document.getElementById("pubCur").value, n1=document.getElementById("pubNew").value, n2=document.getElementById("pubNew2").value;
    if(!cur){ m.textContent="请输入当前访问口令"; return; }
    if(n1.length<6){ m.textContent="新访问口令至少6位"; return; }
    if(n1!==n2){ m.textContent="两次新口令不一致"; return; }
    m.textContent="正在重加密…";
    window.__PUB_reencrypt(cur,n1).then(function(newDoc){
      var blob=new Blob([newDoc],{type:"text/html"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="index.html"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      m.style.color="#86efac"; m.textContent="已生成新的 index.html（旧口令立即失效），请部署该文件";
      document.getElementById("pubCur").value=""; document.getElementById("pubNew").value=""; document.getElementById("pubNew2").value="";
    }).catch(function(err){ m.textContent=err.message||"重加密失败"; });
  };
};
window.__PUB_mountAdmin();   // 解锁屏默认显示 ⚙
</script>
