  if(p<0||e<0) throw new Error("外壳结构异常，无法重建文件");
  return '<!DOCTYPE html>\n' + FULL.slice(0,s) + b64 + FULL.slice(e);
};

          ".pub-modal .pbtn:active{transform:scale(.98)}"+
