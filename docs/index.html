function b64ToBytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function unlock(pass){
  const buf=b64ToBytes(BLOB);
  const salt=buf.slice(0,16), iv=buf.slice(16,28), tag=buf.slice(28,44), ct=buf.slice(44);
  const data=new Uint8Array(ct.length+tag.length);   // Web Crypto 要求认证标签在密文末尾
  data.set(ct,0); data.set(tag,ct.length);
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  let plain;
  try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data); }
  catch(e){ throw new Error("口令错误"); }
  const html=new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const i=document.getElementById("pw"), e=document.getElementById("err");
function run(){ e.textContent=""; const v=i.value; if(!v){e.textContent="请输入口令";return;}
  unlock(v).catch(err=>{ e.textContent=err.message||"解密失败"; }); }
document.getElementById("go").addEventListener("click",run);
i.addEventListener("keydown",ev=>{ if(ev.key==="Enter") run(); });
i.focus();

// ===========================================================================
// 管理员重加密（默认隐藏，点右上角 ⚙ 打开；静态页无独立管理员账号，
// 知道「当前访问口令」者即为管理员——输入当前口令验证身份后设置新口令，
// 浏览器本地重新加密并下载新的 index.html 供部署）
// ===========================================================================
window.__PUB_BLOB = BLOB;                       // 当前密文（供重加密使用）
window.__PUB_SHELL_HTML = document.documentElement.outerHTML;  // 外壳模板（含⚙与重加密逻辑）

function _pubBytesToB64(u){
  var s=""; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s);
}
function _pubConcat(arrs){
  var len=0; arrs.forEach(function(a){len+=a.length;});
  var o=new Uint8Array(len), off=0;
  arrs.forEach(function(a){o.set(a,off);off+=a.length;}); return o;
}
window.__PUB_reencrypt = async function(cur, neu){
  var buf = b64ToBytes(window.__PUB_BLOB);
  var salt=buf.slice(0,16), iv=buf.slice(16,28), tag=buf.slice(28,44), ct=buf.slice(44);
  var data=new Uint8Array(ct.length+tag.length); data.set(ct,0); data.set(tag,ct.length);
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(cur),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var plain;
  try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,data); }
  catch(e){ throw new Error("当前访问口令错误"); }
  var html=new TextDecoder().decode(plain);
  // 用新口令重新加密
  var salt2=crypto.getRandomValues(new Uint8Array(16));
  var iv2=crypto.getRandomValues(new Uint8Array(12));
  var km3=await crypto.subtle.importKey("raw",enc.encode(neu),"PBKDF2",false,["deriveKey"]);
  var key2=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt2,iterations:600000,hash:"SHA-256"},km3,{name:"AES-GCM",length:256},false,["encrypt"]);
  var ctBuf=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv2},key2,enc.encode(html));
  var ctA=new Uint8Array(ctBuf);
  var ctNew=ctA.slice(0,ctA.length-16), tagNew=ctA.slice(ctA.length-16);
  var blob=_pubConcat([salt2,iv2,tagNew,ctNew]);
  var b64=_pubBytesToB64(blob);
  // 用外壳源重建文件（仅替换 BLOB）
  var FULL=window.__PUB_SHELL_HTML;
  var MARK='const BLOB = "';
  var p=FULL.indexOf(MARK); var s=p+MARK.length; var e=FULL.indexOf('";',s);
  if(p<0||e<0) throw new Error("外壳结构异常，无法重建文件");
  return '<!DOCTYPE html>\n' + FULL.slice(0,s) + b64 + FULL.slice(e);
};

window.__PUB_mountAdmin = function(){
  if(window.__PUB_adminMounted) return; window.__PUB_adminMounted=true;
  var css=".pub-set{position:fixed;top:12px;right:12px;z-index:9999;width:42px;height:42px;border-radius:10px;"+
          "border:1px solid #374151;background:#111827;color:#fde7a8;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}"+
          ".pub-set:hover{border-color:#60a5fa}"+
          ".pub-mask{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;z-index:9998;padding:18px}"+
          ".pub-mask.hidden{display:none}"+
          ".pub-modal{width:min(92vw,380px);background:#0f172a;border:1px solid #334155;border-radius:14px;padding:24px;color:#e5e7eb;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}"+
          ".pub-modal h3{margin:0 0 4px;font-size:18px;color:#f9fafb}"+
          ".pub-modal .psub{font-size:12px;color:#94a3b8;margin:0 0 16px}"+
          ".pub-modal label{display:block;font-size:12px;color:#94a3b8;margin:12px 0 5px}"+
          ".pub-modal input{width:100%;padding:11px 12px;font-size:15px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;outline:none}"+
          ".pub-modal input:focus{border-color:#60a5fa}"+
          ".pub-modal .pbtn{margin-top:16px;width:100%;padding:12px;border:none;border-radius:9px;font-size:15px;font-weight:600;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;cursor:pointer}"+
          ".pub-modal .pbtn:active{transform:scale(.98)}"+
          ".pub-modal .pmsg{font-size:13px;min-height:16px;margin-top:10px}"+
          ".pub-modal .px{position:absolute;top:12px;right:14px;cursor:pointer;color:#94a3b8;font-size:20px;line-height:1}";
  var st=document.createElement("style"); st.id="pubAdminStyle"; st.textContent=css; document.head.appendChild(st);
  var btn=document.createElement("button"); btn.className="pub-set"; btn.textContent="⚙"; btn.title="管理员重加密";
  document.body.appendChild(btn);
  var mask=document.createElement("div"); mask.className="pub-mask hidden"; mask.id="pubMask";
  mask.innerHTML='<div class="pub-modal">'+
    '<span class="px" id="pubClose">×</span>'+
    '<h3>管理员重加密</h3>'+
    '<p class="psub">输入当前访问口令验证身份，再设置新口令；完成后将下载新的 index.html 供部署</p>'+
    '<div class="pmsg" id="pubMsg" style="color:#f87171"></div>'+
    '<label>当前访问口令</label><input id="pubCur" type="password" placeholder="当前口令" autocomplete="off">'+
    '<label>新访问口令</label><input id="pubNew" type="password" placeholder="新口令(至少6位)" autocomplete="off">'+
    '<label>确认新访问口令</label><input id="pubNew2" type="password" placeholder="再次输入" autocomplete="off">'+
    '<button class="pbtn" id="pubSave">重 加 密 并 下 载</button>'+
    '</div>';
  document.body.appendChild(mask);
  function openAdmin(){ mask.classList.remove("hidden"); }
  btn.onclick=openAdmin;
  document.getElementById("pubClose").onclick=function(){ mask.classList.add("hidden"); };
  mask.addEventListener("click",function(e){ if(e.target===mask) mask.classList.add("hidden"); });
  document.getElementById("pubSave").onclick=function(){
    var m=document.getElementById("pubMsg"); m.style.color="#f87171"; m.textContent="";
    var cur=document.getElementById("pubCur").value, n1=document.getElementById("pubNew").value, n2=document.getElementById("pubNew2").value;
    if(!cur){ m.textContent="请输入当前访问口令"; return; }
    if(n1.length<6){ m.textContent="新访问口令至少6位"; return; }
    if(n1!==n2){ m.textContent="两次新口令不一致"; return; }
    m.textContent="正在重加密…";
    window.__PUB_reencrypt(cur,n1).then(function(newDoc){
      var blob=new Blob([newDoc],{type:"text/html"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="index.html"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      m.style.color="#86efac"; m.textContent="已生成新的 index.html（旧口令立即失效），请部署该文件";
      document.getElementById("pubCur").value=""; document.getElementById("pubNew").value=""; document.getElementById("pubNew2").value="";
    }).catch(function(err){ m.textContent=err.message||"重加密失败"; });
  };
};
window.__PUB_mountAdmin();   // 解锁屏默认显示 ⚙
